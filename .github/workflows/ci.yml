name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync (core + dev)
        run: uv sync --group dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov=localforge --cov-report=term-missing

      # CPU smoke of the comparison pipeline is added once the CLI lands (T12).
      # - name: CPU smoke compare
      #   run: uv run localforge compare --suite config/suites/demo.yaml --backend transformers
