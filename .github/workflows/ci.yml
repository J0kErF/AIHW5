name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync (core + dev)
        run: uv sync --group dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test (offline; slow/real-model tests excluded)
        run: uv run pytest -m "not slow" --cov=localforge --cov-report=term-missing

      - name: CPU smoke — run pipeline with the dependency-free fake backend
        run: uv run localforge run --backend fake --model fake/tiny --max-new-tokens 8

      - name: CPU smoke — visualizer via replay (no model, no GPU)
        run: uv run localforge visualize --replay tests/data/sample_paging.jsonl --no-tui
