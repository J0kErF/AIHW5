# CPU-only smoke suite: the three-backend comparison from L08 §9.
# Unavailable backends (no Ollama daemon / airllm not installed) are reported
# as skipped rows, not errors. See docs/SPECIFICATION.md §3.4.
suite_id: demo
models:
  - "Qwen/Qwen2.5-0.5B-Instruct"
backends:
  - transformers
  - ollama
  - airllm
dtypes:
  - fp32
prompt: "Explain virtual memory in one sentence."
max_new_tokens: 64
seed: 0
# Map the HF repo id to its Ollama tag so the same model is compared across backends.
ollama_aliases:
  "Qwen/Qwen2.5-0.5B-Instruct": "qwen2.5:0.5b"
