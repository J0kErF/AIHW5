[project]
name = "localforge"
version = "0.1.0"
description = "Forge LLMs on the hardware you have: unified local inference (transformers/Ollama/AirLLM), profiling, PEFT fine-tuning, and an OS-style paging visualizer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "moamteam" }]
keywords = ["llm", "airllm", "ollama", "lora", "qlora", "quantization", "inference", "profiling"]

# Core is intentionally light + always-installable on a CPU-only machine.
# Fragile / platform-specific engines (bitsandbytes, airllm, ollama) live in
# optional extras and are added in their respective build phases. See docs/DECISIONS.md D1.
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "textual>=0.60",
    "torch>=2.2",
    "transformers>=4.44",
    "huggingface-hub>=0.24",
    "httpx>=0.27",
    "peft>=0.12",
    "accelerate>=0.33",
    "safetensors>=0.4",
    "psutil>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Added/validated in later phases (kept out of the default lock to stay green on CPU-only Windows):
gpu = ["bitsandbytes>=0.43"]
ollama = ["ollama>=0.3"]
airllm = ["airllm>=2.11"]

[project.scripts]
localforge = "localforge.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localforge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]
# Typer relies on function calls (typer.Option/Argument) in parameter defaults.
"src/localforge/cli/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["src/localforge"]
strict = true
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "needs_cuda: requires a CUDA GPU",
    "needs_ollama: requires a running Ollama daemon",
    "needs_airllm: requires the airllm package",
    "slow: slow test (model download / real inference)",
]

[tool.coverage.run]
source = ["localforge"]
branch = true
